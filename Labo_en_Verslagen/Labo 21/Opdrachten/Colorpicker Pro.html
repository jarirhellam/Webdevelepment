<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="colorPicker.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker Pro</title>
</head>
<body>
<div class="colorPicker">
    <div class="components">
        <div class="component">
            <span>0 <label for="sldrood"></label><input id="sldrood" type="range" class="slider" value="128" min="0" max="255"> 255</span>
            <span>Rood</span>
            <span id="rood">128</span>
        </div>
        <div class="component">
            <span>0 <label for="sldgroen"></label><input id="sldgroen" type="range" class="slider" value="128" min="0" max="255"> 255</span>
            <span>Groen</span>
            <span id="groen">128</span>
        </div>
        <div class="component">
            <span>0 <label for="sldblauw"></label><input id="sldblauw" type="range" class="slider" value="128" min="0" max="255"> 255</span>
            <span>Blauw</span>
            <span id="blauw">128</span>
        </div>
    </div>
    <div class="swatch" id="swatch"></div>
    <input type="button" id="btnSave" value="Save color">
    <input type="button" id="btnClear" value="Clear all saved colors">
</div>

<div id="divColor"></div>

<script src="scripts/colorPickerPro.js"></script>
</body>
</html>
