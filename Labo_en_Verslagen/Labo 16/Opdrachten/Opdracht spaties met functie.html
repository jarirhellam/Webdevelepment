<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Spaties functie</title>
</head>
<body>

<h3>Typ een woord</h3>

<label for="tekst"></label><input type="text" id="tekst">
<button onclick="start()">Toon</button>

<script>

    function maakMetSpaties(woord){

        let resultaat = "";

        for(let i = 0; i < woord.length; i++){

            resultaat = resultaat + woord[i] + " ";

        }

        return resultaat;

    }

    function start(){

        let tekst = document.getElementById("tekst").value;

        let output = maakMetSpaties(tekst);

        console.log(output);

    }

</script>

</body>
</html>
