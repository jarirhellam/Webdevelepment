<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>typeof oefening</title>
</head>
<body>

<h2>Open de console (F12)</h2>

<script>

    let leeftijd = 34;
    let intrest = 0.12;
    let isGevaarlijk = true;
    let vandaag = new Date();
    const print = (message) => { console.log(message); };

    console.log("leeftijd:", typeof leeftijd);
    console.log("intrest:", typeof intrest);
    console.log("isGevaarlijk:", typeof isGevaarlijk);
    console.log("vandaag:", typeof vandaag);
    console.log("print:", typeof print);

</script>

</body>
</html>
