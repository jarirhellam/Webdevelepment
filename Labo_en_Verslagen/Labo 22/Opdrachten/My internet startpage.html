<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Internet Start Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mt-4">

    <h1>My Internet Start Page</h1>

    <div class="mb-2">
        <label for="input-command" class="form-label fw-semibold">Zoekopdracht</label>
        <input
                type="text"
                id="input-command"
                class="form-control"
                placeholder="Enter commando"
        >
        <small class="text-muted">Start your commando with "/[character] [zoekopdracht]*"</small>
    </div>

    <div class="mb-4">
        <button id="btn-go" onclick="handleGo()">GO!</button>
    </div>

    <div id="history-section">
        <h2>History</h2>
        <div class="row row-cols-1 row-cols-md-3 g-3" id="history-grid">
            <!-- Cards worden hier dynamisch toegevoegd via JavaScript -->
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Scripts/script.js"></script>
</body>
</html>
